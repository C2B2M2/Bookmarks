<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая вкладка</title>
    <style>
        :root {
            --bg-color: #3C3C3C;
            --card-bg: #2A2A2A;
            --text-color: #F1F1F1;
            --accent-white: #FFFFFF;
            --hover-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 12vh;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
            overflow: hidden;
            box-sizing: border-box;
        }
        .google-logo {
            font-size: 90px;
            font-weight: 500;
            margin-bottom: 50px;
            letter-spacing: -3px;
            user-select: none;
            display: flex;
        }
        .g1 { color: #4285f4; }
        .o1 { color: #ea4335; }
        .o2 { color: #fbbc05; }
        .g2 { color: #4285f4; }
        .l { color: #34a853; }
        .e { color: #ea4335; }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(6, 112px);
            gap: 20px 24px;
            justify-content: center;
        }
        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            padding: 16px 0;
            border-radius: 12px;
            transition: background-color 0.3s ease;
            position: relative;
            cursor: pointer;
        }
        .shortcut:hover {
            background-color: var(--hover-bg);
        }
        .icon-circle {
            width: 58px;
            height: 58px;
            background-color: var(--card-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 14px;
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            box-shadow: 0 3px 6px rgba(0,0,0,0.25);
            transition: all 0.25s ease;
        }
        .shortcut:hover .icon-circle {
            background-color: var(--accent-white);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .shortcut-label {
            font-size: 13px;
            width: 100px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- ЛОГИКА ПАПКИ (+10% К ПРЕДЫДУЩЕМУ) --- */
        .folder-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .folder-content {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #252525;
            border-radius: 18px;
            padding: 14px; 
            /* Колонки стали 100px (было 90px) */
            grid-template-columns: repeat(2, 100px); 
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Параметры ярлыков внутри папки */
        .folder-content .shortcut {
            padding: 10px 0;
        }

        .folder-content .icon-circle {
            width: 51px;      /* Было 46px (+10%) */
            height: 51px;     /* Было 46px (+10%) */
            font-size: 20px;  /* Шрифт чуть крупнее */
            margin-bottom: 10px;
        }

        .folder-content .shortcut-label {
            font-size: 12px;  /* Было 11px */
            width: 90px;
        }

        .folder-wrapper:hover .folder-content {
            display: grid;
        }
    </style>
</head>
<body>
    <div class="google-logo">
        <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
    </div>
    <div class="shortcuts-grid">
        <a href="https://www.ya.ru" class="shortcut">
            <div class="icon-circle">Ya</div>
            <span class="shortcut-label">Яндекс</span>
        </a>
        <a href="https://www.playground.ru" class="shortcut">
            <div class="icon-circle">Pg</div>
            <span class="shortcut-label">PlayGround</span>
        </a>
        <a href="https://www.youtube.com" class="shortcut">
            <div class="icon-circle">Y</div>
            <span class="shortcut-label">YouTube</span>
        </a>

        <!-- ПАПКА VK ПОВЕРХ -->
        <div class="folder-wrapper">
            <div class="shortcut">
                <div class="icon-circle" style="color: #4285f4; border: 1px solid rgba(66, 133, 244, 0.3);">Vk</div>
                <span class="shortcut-label">Сообщества</span>
            </div>
            <div class="folder-content">
                <a href="https://vk.com/shilkaanonim" class="shortcut">
                    <div class="icon-circle">Sh</div>
                    <span class="shortcut-label">Шилка</span>
                </a>
                <a href="https://vk.com/chita_overhear" class="shortcut">
                    <div class="icon-circle">Ch</div>
                    <span class="shortcut-label">Чита</span>
                </a>
            </div>
        </div>

        <a href="http://4pda.to" class="shortcut">
            <div class="icon-circle">4</div>
            <span class="shortcut-label">4pda</span>
        </a>
        <a href="https://www.chita.ru" class="shortcut">
            <div class="icon-circle">Ch</div>
            <span class="shortcut-label">Чита</span>
        </a>
        <a href="https://2ch.org" class="shortcut">
            <div class="icon-circle">2</div>
            <span class="shortcut-label">2ch</span>
        </a>
        <a href="https://dtf.ru" class="shortcut">
            <div class="icon-circle">K</div>
            <span class="shortcut-label">Dtf</span>
        </a>
        <a href="https://github.com" class="shortcut">
            <div class="icon-circle">G</div>
            <span class="shortcut-label">Github</span>
        </a>
        <a href="https://www.kinopoisk.ru" class="shortcut">
            <div class="icon-circle">K</div>
            <span class="shortcut-label">Кинопоиск</span>
        </a>
        <a href="https://rutracker.org" class="shortcut">
            <div class="icon-circle">R</div>
            <span class="shortcut-label">Рутрекер</span>
        </a>
    </div>
</body>
</html>
